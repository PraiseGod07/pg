<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="description" content="PG — your voice-first personal assistant. Say “Hi PG”, tell it your day, and it plans your day, teaches you bass, keeps your Bible plan and remembers what you learn.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PG">
<title>PG — Personal Assistant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <!-- Left rail (desktop) -->
  <nav class="rail" aria-label="Main">
    <div class="brand" aria-label="PG">
      <span class="mark">PG</span>
    </div>
    <button class="rail-btn" data-view="today" aria-label="Today"><svg><use href="#i-cal"/></svg><span>Today</span></button>
    <button class="rail-btn" data-view="bass" aria-label="Bass"><svg><use href="#i-music"/></svg><span>Bass</span></button>
    <button class="rail-btn" data-view="bible" aria-label="Bible"><svg><use href="#i-book"/></svg><span>Bible</span></button>
    <button class="rail-btn" data-view="gym" aria-label="Gym"><svg><use href="#i-gym"/></svg><span>Gym</span></button>
    <button class="rail-btn" data-view="notes" aria-label="Notes"><svg><use href="#i-note"/></svg><span>Notes</span></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" data-view="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
  </nav>

  <main id="main" class="main" tabindex="-1">
    <header class="topbar">
      <div class="topbar-brand"><span class="mark">PG</span></div>
      <div class="listen-pill" id="listenPill" role="status" aria-live="polite"></div>
      <button class="icon-btn" data-view="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </header>
    <div id="view" class="view"></div>
  </main>

  <!-- Assistant panel: right column on desktop, bottom sheet on mobile -->
  <aside class="assistant" id="assistant" aria-label="PG assistant">
    <button class="icon-btn as-close" id="asClose" aria-label="Close assistant"><svg><use href="#i-x"/></svg></button>
    <div class="orb-wrap">
      <button class="orb" id="orb" aria-label="Talk to PG" data-state="off">
        <span class="orb-ring r1"></span><span class="orb-ring r2"></span><span class="orb-ring r3"></span>
        <span class="orb-core"><svg><use href="#i-mic"/></svg></span>
      </button>
      <div class="orb-status" id="orbStatus">Tap to talk</div>
      <div class="orb-heard" id="heard" aria-live="polite"></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="suggest" id="suggest"></div>
    <form class="composer" id="composer" autocomplete="off">
      <input id="ask" type="text" placeholder="Type to PG…" aria-label="Type a message to PG" enterkeyhint="send">
      <button class="send" aria-label="Send"><svg><use href="#i-send"/></svg></button>
    </form>
  </aside>

  <!-- Mobile dock -->
  <nav class="dock" aria-label="Main">
    <button class="dock-btn" data-view="today"><svg><use href="#i-cal"/></svg><span>Today</span></button>
    <button class="dock-btn" data-view="bass"><svg><use href="#i-music"/></svg><span>Bass</span></button>
    <button class="dock-btn" data-view="bible"><svg><use href="#i-book"/></svg><span>Bible</span></button>
    <button class="dock-orb" id="dockOrb" aria-label="Talk to PG" data-state="off"><svg><use href="#i-mic"/></svg></button>
    <button class="dock-btn" data-view="gym"><svg><use href="#i-gym"/></svg><span>Gym</span></button>
    <button class="dock-btn" data-view="notes"><svg><use href="#i-note"/></svg><span>Notes</span></button>
    <button class="dock-btn" data-view="settings"><svg><use href="#i-gear"/></svg><span>More</span></button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
    <symbol id="i-gym" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v16H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H20v-3M12 7v6M9 9.5h6"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V17h5v-1.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3zM9.5 20.5h5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  </defs>
</svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
